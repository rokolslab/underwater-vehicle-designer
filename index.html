<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Обвод дирижабля</title>
    <script type="module" src="/src/app/main.ts"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1>Обвод дирижабля</h1>
          <div class="formula-line">
            y = +/- 0.972 D sqrt((x/L)(1 - x/L)(1 - 0.5 x/L))
          </div>
        </div>
        <dl class="metrics" aria-label="Расчётные параметры">
          <div>
            <dt>Макс. ордината</dt>
            <dd id="max-radius">0.000</dd>
          </div>
          <div>
            <dt>Полная высота</dt>
            <dd id="max-height">0.000</dd>
          </div>
          <div>
            <dt>x max</dt>
            <dd id="max-x">0.000</dd>
          </div>
          <div>
            <dt>Полная длина</dt>
            <dd id="total-length">0.0000</dd>
          </div>
          <div>
            <dt>ЦВК</dt>
            <dd id="cylindrical-insert-length-metric">0.0000</dd>
          </div>
        </dl>
      </header>

      <section class="workbench" aria-label="Построение обводов">
        <aside class="control-panel">
          <form id="controls" class="control-grid">
            <label>
              <span>Длина L</span>
              <input id="length" type="number" min="0.1" step="0.1" value="6" />
            </label>
            <label>
              <span>Удлинение λ = L / D</span>
              <input id="slenderness" type="number" min="0.1" step="0.1" value="3" />
            </label>
            <label>
              <span>Диаметр D</span>
              <input id="diameter" type="number" min="0.01" step="0.01" value="2" />
            </label>
            <label>
              <span>Станции</span>
              <input id="stations" type="number" min="8" max="80" step="1" value="20" />
            </label>
            <label>
              <span>ЦВК, м</span>
              <input id="cylindrical-insert-length" type="number" min="0" max="3" step="0.1" value="0" />
            </label>
            <label class="toggle-row">
              <input id="show-grid" type="checkbox" checked />
              <span>Сетка</span>
            </label>
            <label class="toggle-row">
              <input id="show-points" type="checkbox" checked />
              <span>Точки станций</span>
            </label>
          </form>

          <div class="source-block">
            <div class="source-title">Из таблицы</div>
            <div>D = L / λ</div>
            <div>ЦВК = Lcyl</div>
            <div>верх: y(x)</div>
            <div>низ: -y(x)</div>
          </div>

          <div class="actions">
            <button id="download-svg" type="button">Скачать SVG</button>
            <button id="download-csv" type="button">CSV</button>
            <button id="reset" type="button">Сброс</button>
          </div>
        </aside>

        <section class="visualization-panels">
          <section class="drawing-panel" aria-label="2D-проекция корпуса">
            <canvas id="profile-canvas" aria-label="Теоретический обвод дирижабля"></canvas>
          </section>
          <section class="scene3d-panel" aria-label="3D-представление корпуса">
            <div class="scene3d-header">
              <div class="panel-title">3D корпус</div>
              <div class="scene3d-controls" aria-label="Настройки 3D">
                <label>
                  <span>Режим</span>
                  <select id="scene3d-mode">
                    <option value="solid">Solid</option>
                    <option value="x-ray">X-Ray</option>
                    <option value="cutaway">Cutaway</option>
                  </select>
                </label>
                <label>
                  <span>Прозрачность</span>
                  <input id="scene3d-opacity" type="range" min="0.12" max="0.45" step="0.01" value="0.28" />
                </label>
                <label>
                  <span>Сечение</span>
                  <select id="scene3d-section-type">
                    <option value="disabled">Нет</option>
                    <option value="crossSectionX">X</option>
                    <option value="longitudinalPlane">Плоскость</option>
                  </select>
                </label>
                <label>
                  <span>X</span>
                  <input id="scene3d-section-x" type="number" min="0" step="0.1" value="3" />
                </label>
                <label>
                  <span>Плоскость</span>
                  <select id="scene3d-section-plane">
                    <option value="xy">XY</option>
                    <option value="xz">XZ</option>
                  </select>
                </label>
                <label>
                  <span>Смещение</span>
                  <input id="scene3d-section-offset" type="number" step="0.1" value="0" />
                </label>
              </div>
            </div>
            <div id="hull-scene-3d" class="scene3d" aria-label="3D-модель корпуса"></div>
          </section>
        </section>
      </section>

      <section class="equipment-band" aria-label="Оборудование">
        <div class="data-header">
          <h2>Оборудование</h2>
          <button id="add-equipment" class="compact-action" type="button">Добавить</button>
        </div>
        <div id="equipment-list" class="equipment-list"></div>
      </section>

      <section class="data-band" aria-label="Координаты">
        <div class="data-header">
          <h2>Координаты станций</h2>
          <span id="point-count"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>N</th>
                <th>x</th>
                <th>y верх</th>
                <th>y низ</th>
              </tr>
            </thead>
            <tbody id="coordinate-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
