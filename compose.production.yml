x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-security: &default-security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=100m,mode=1777
    - /var/cache/nginx:rw,noexec,nosuid,size=50m,uid=101,gid=101,mode=0755
    - /var/run:rw,noexec,nosuid,size=10m,uid=101,gid=101,mode=0755

services:
  app:
    <<: *default-security
    restart: unless-stopped
    logging: *default-logging
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    ports:
      - "${APP_PORT:-80}:8080"

